<!doctype html>
<html lang="en" data-theme="amber" data-mode="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<!-- Build stamp — replaced at image build time (sed in the Containerfile) from
     DAV_REPO_COMMIT. Surfaced in the account menu + console so you can confirm
     exactly which UI build a browser is running (vs a stale cached copy). -->
<meta name="dav-build" content="__DAV_BUILD__" />
<title>DAV Console</title>
<!--@DAV-MODULE js/theme-init.js script-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,700;1,400&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
<!-- Red Hat theme fonts (used only by data-theme="redhat"; progressive — falls back if unreachable) -->
<link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@400;500;700&family=Red+Hat+Text:wght@400;500;700&family=Red+Hat+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<!--@DAV-MODULE styles/app.css style-->
</head>
<body>

<div class="pf-shell">

<!-- Invite-accept overlay (shown when the URL has ?invite=<token>) -->
<div id="inviteAcceptOverlay" style="display:none;position:fixed;inset:0;z-index:9999;background:var(--bg);align-items:center;justify-content:center;">
  <div style="max-width:420px;width:90%;padding:24px;border:1px solid var(--border);border-radius:6px;background:var(--bg-panel);">
    <div style="font-size:16px;font-weight:600;margin-bottom:4px;">Join DAV</div>
    <div id="inviteAcceptInfo" style="font-size:12px;color:var(--text-dim);margin-bottom:14px;">Loading invite…</div>
    <div id="inviteAcceptForm" style="display:none;">
      <label style="font-size:11px;color:var(--text-faint);">Display name</label>
      <input id="inviteName" style="width:100%;margin:2px 0 10px;" />
      <label style="font-size:11px;color:var(--text-faint);">Set a password (min 8 characters)</label>
      <input id="invitePw" type="password" style="width:100%;margin:2px 0 14px;" />
      <button class="btn primary" id="inviteAcceptBtn" style="width:100%;">Set password &amp; join</button>
      <div id="inviteAcceptMsg" style="font-size:11px;margin-top:8px;"></div>
    </div>
  </div>
</div>

<!-- Sign-in screen (shown when unauthenticated under a relaxed proxy) -->
<div id="loginOverlay" style="display:none;position:fixed;inset:0;z-index:9997;background:var(--bg);align-items:center;justify-content:center;">
  <div style="max-width:360px;width:90%;padding:24px;border:1px solid var(--border);border-radius:6px;background:var(--bg-panel);">
    <div id="loginTitle" style="font-size:16px;font-weight:600;margin-bottom:14px;">Sign in to DAV</div>
    <div id="loginBody">
      <input id="loginEmail" placeholder="email" style="width:100%;margin-bottom:8px;" />
      <input id="loginPw" type="password" placeholder="password" style="width:100%;margin-bottom:12px;" />
      <button class="btn primary" id="loginBtn" style="width:100%;">Sign in</button>
      <div id="loginMsg" style="font-size:11px;margin-top:8px;"></div>
    </div>
  </div>
</div>

<!-- Forced password change (default admin first login) -->
<div id="pwChangeOverlay" style="display:none;position:fixed;inset:0;z-index:9998;background:var(--bg);align-items:center;justify-content:center;">
  <div style="max-width:380px;width:90%;padding:24px;border:1px solid var(--border);border-radius:6px;background:var(--bg-panel);">
    <div style="font-size:15px;font-weight:600;margin-bottom:4px;">Change password</div>
    <div id="pwChangeSub" style="font-size:12px;color:var(--text-dim);margin-bottom:14px;">Enter your current password and a new one.</div>
    <input id="pwChangeCur" type="password" placeholder="Current password" style="width:100%;margin-bottom:8px;" />
    <input id="pwChangeNew" type="password" placeholder="New password (min 8)" style="width:100%;margin-bottom:12px;" />
    <button class="btn primary" id="pwChangeBtn" style="width:100%;">Set password</button>
    <button class="btn ghost" id="pwChangeCancel" style="width:100%;margin-top:8px;display:none;">Cancel</button>
    <div id="pwChangeMsg" style="font-size:11px;margin-top:8px;"></div>
  </div>
</div>

<!--@DAV-MODULE shell/masthead.html html-->

<!-- ══ Body row ══ -->
<div class="pf-body">

  <!-- ── Left sidebar nav ── -->
  <nav class="pf-nav" id="pfNav">
    <!-- Domain rail — rendered from the DOMAINS map by renderDomainRail() at boot.
         Each anchor is data-domain (+ data-focus for the focus filter); sub-views
         render as the #domainTabs top strip. -->
    <div class="pf-nav-items"></div>
    <div class="pf-nav-footer" style="padding:8px 14px;font-size:10px;color:var(--text-faint);">
      <span id="kwhChip" title="Cluster-wide GPU energy" style="display:none;">
        <span style="color:var(--accent);">⚡</span>
        <span id="kwhValue">—</span>
      </span>
    </div>
  </nav>

  <!-- ── Content area ── -->
  <div class="pf-content">

    <!-- Domain sub-view tab strip (populated per active domain by renderDomainTabs) -->
    <div class="tabs domain-tabs" id="domainTabs" role="tablist" style="display:none;"></div>

    <!-- ══════════════ SCOPING SETS (Authoring) ══════════════ -->
<!--@DAV-MODULE views/scopingsets.html html-->

    <!-- ══════════════ RUNS ══════════════ -->
<!--@DAV-MODULE views/runs.html html-->

    <!-- ══════════════ RESULTS ══════════════ -->
<!--@DAV-MODULE views/results.html html-->

    <!-- ══════════════ USE CASES (merged with Scoping Sets-as-filter) ══════════════ -->
<!--@DAV-MODULE views/usecases.html html-->

    <!-- ══════════════ INBOX (PR-comment curation, M8 of #28) ══════════════ -->
<!--@DAV-MODULE views/inbox.html html-->

    <!-- ══════════════ REVIEW & PLAN (top-level tab) ══════════════ -->
<!--@DAV-MODULE views/review.html html-->

    <!-- ══════════════ ENHANCEMENT / PR WORKBENCH (#138) ══════════════ -->
<!--@DAV-MODULE views/enhancement.html html-->

    <!-- ══════════════ ENGINEERING ROADMAP (Track 2) ══════════════ -->
<!--@DAV-MODULE views/engineering.html html-->

    <!-- ══════════════ CAPABILITY CATALOG (Track 1 — capability identification) ══════════════ -->
<!--@DAV-MODULE views/catalog.html html-->

    <!-- ══════════════ CAP MAP (bidirectional UC ↔ capability matrix) ══════════════ -->
<!--@DAV-MODULE views/capmap.html html-->

    <!-- ══════════════ AUDIT (who did what + auth events) ══════════════ -->
<!--@DAV-MODULE views/audit.html html-->

    <!-- ══════════════ ASSESSMENTS (F7: ingest assessment outputs → capability findings) ══════════════ -->
<!--@DAV-MODULE views/assess.html html-->

    <!-- ══════════════ MATURITY WALL (#147 — FlightPath-style assessment) ══════════════ -->
<!--@DAV-MODULE views/maturity.html html-->

    <!-- ══════════════ IMPROVE (self-improvement: diagnose & propose) ══════════════ -->
<!--@DAV-MODULE views/improve.html html-->

    <!-- USERS & ROLES + AGENTS consolidated into Config → Platform (this view retired). -->

    <!-- (retired empty #view-projects shell removed — the live Projects tab is in the
         Customers & Projects domain below; projects admin relocated out of Config) -->

    <!-- ══════════════ CUSTOMERS ══════════════ -->
<!--@DAV-MODULE views/customers.html html-->

    <!-- ══════════════ PROJECTS (tab of Customers & Projects domain) ══════════════ -->
    <!-- Relocated out of Config → Platform; same ids so loadProjectsAdmin reuses it. -->
<!--@DAV-MODULE views/projects.html html-->

    <!-- ══════════════ CONFIG ══════════════ -->
<!--@DAV-MODULE views/config.html html-->

  </div><!-- /pf-content -->

</div><!-- /pf-body -->

<footer class="pf-footer">
  <span>DAV Console · v0.9.6</span>
  <div id="apiStatusEl" style="display:flex; align-items:center;">
    <span class="api-dot"></span>
    <span id="apiStatusText">connecting…</span>
  </div>
</footer>

</div><!-- /pf-shell -->

<!--@DAV-MODULE shell/modals.html html-->

<div class="toast" id="toast"></div>

<!--@DAV-MODULE js/app/ script-->
</body>
</html>
