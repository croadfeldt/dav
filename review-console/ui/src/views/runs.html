    <section class="pf-view active" id="view-runs">
      <div class="runs-split">
        <!-- Left: run list -->
        <div class="runs-list-panel" id="runsListPanel">
          <div class="panel-header" style="flex-shrink:0;">
            <div class="panel-title">Analyses</div>
            <div class="toolbar-actions">
              <button class="btn ghost btn-icon" id="toggleArchivedRuns" title="Show archived analyses">⊟</button>
              <button class="btn ghost btn-icon" id="refreshRunsBtn" title="Refresh">↻</button>
              <button class="btn primary btn-sm" id="newRunBtn" data-edit-gate="project.runs.execute">+ New Analysis</button>
            </div>
          </div>
          <div class="panel-toolbar" style="gap:6px;flex-shrink:0;">
            <input id="runFilter" placeholder="filter analyses…" style="flex:1;" />
            <select id="runPhaseFilter" style="flex:none;width:96px;font-size:10px;padding:3px 5px;">
              <option value="">all</option>
              <option value="Running">running</option>
              <option value="Succeeded">succeeded</option>
              <option value="Failed">failed</option>
              <option value="Cancelled">cancelled</option>
              <option value="TimedOut">timed out</option>
            </select>
            <button class="btn ghost btn-sm" id="runSelectAllBtn" title="Select / deselect all visible analyses">☑ All</button>
          </div>
          <div id="runSelectionToolbar" style="display:none;padding:6px 10px;background:var(--accent-bg);border-bottom:1px solid var(--accent-soft);align-items:center;gap:6px;font-size:11px;flex-shrink:0;">
            <span id="runSelectionCount" style="flex:1;color:var(--accent);font-weight:500;"></span>
            <button class="btn ghost btn-sm" id="runSelArchiveBtn" title="Archive the selected analyses (hide)">Archive</button>
            <button class="btn danger btn-sm" id="runSelDeleteBtn" title="Delete the selected analyses completely (irreversible)">Delete</button>
            <button class="btn ghost btn-sm" id="runSelClearBtn" title="Clear selection">×</button>
          </div>
          <div style="padding:6px 10px;border-bottom:1px solid var(--border);font-size:10px;color:var(--text-faint);flex-shrink:0;" id="runsNote"></div>
          <div class="scrollable" id="runsList"><div class="empty">loading…</div></div>
        </div>
        <div class="split-resizer" data-rs-left="runsListPanel" data-rs-storage="rsRunsListW"></div>
        <!-- Right: run detail -->
        <div class="runs-detail-panel" id="runsDetailPanel">
          <div id="rdPanelHeader" class="rd-panel-header" style="display:none;">
            <div class="rd-header-top">
              <div class="rd-panel-title" id="rdTitle">—</div>
              <div class="rd-header-actions">
                <button class="btn ghost btn-sm" id="rdDiagnoseBtn" style="display:none;font-size:10px;" title="Diagnose this analysis's failures and propose fixes (Improve tab)">🩺 Diagnose</button>
                <button class="btn ghost btn-sm" id="rdViewResultsBtn" style="display:none;font-size:10px;">View Results →</button>
                <button class="btn ghost btn-sm" id="rdReviewBtn" style="display:none;font-size:10px;" title="Generate the architecture review, enhancement plan and PRs in Roadmaps, scoped to this analysis's Scoping Set">Review this analysis →</button>
              </div>
            </div>
            <div class="rd-panel-sub" id="rdSub"></div>
            <div class="rd-header-stats" id="rdHeaderStats"></div>
          </div>
          <!-- Tab strip inside run detail -->
          <div id="rdTabStrip" class="rd-tab-strip" style="display:none;">
            <button class="rd-tab active" id="rdTabRun">Analysis</button>
          </div>
          <!-- Run body -->
          <div class="runs-detail-body" id="rdRunBody">
            <div class="rd-empty">Select an analysis from the list</div>
          </div>
        </div><!-- /runs-detail-panel -->
      </div><!-- /runs-split -->
    </section>
