# LDAP config for DAV multi-user approval + roles.
#
# Identity is established by the oauth-proxy (X-Forwarded-User/-Email). This
# Secret tells the API which LDAP group defines APPROVED users, and how to read
# it. The API deployment already mounts this Secret via `envFrom` (optional), so
# you only need to create/fill it and restart the API.
#
# SAFETY: the access gate is a no-op until BOTH the server is reachable AND
# DAV_LDAP_ENFORCE=true. Configure first, verify the user list in
# Config -> Users & Access, THEN flip enforcement on.
#
# Apply:
#   cp dav-ldap-secret.example.yaml dav-ldap-secret.yaml   # fill in real values
#   oc apply -f dav-ldap-secret.yaml -n dav
#   oc rollout restart deploy/dav-review-api -n dav
#
apiVersion: v1
kind: Secret
metadata:
  name: dav-ldap
  namespace: dav
type: Opaque
stringData:
  # ── Required ──────────────────────────────────────────────────────────────
  DAV_LDAP_URL: "ldaps://ldap.roadfeldt.com:636"          # blank/absent => LDAP disabled
  DAV_LDAP_GROUP_DN: "cn=dav-users,ou=groups,dc=roadfeldt,dc=com"   # the approval group
  DAV_LDAP_USER_BASE: "ou=people,dc=roadfeldt,dc=com"     # where to resolve members

  # ── Service-account bind (read-only) ──────────────────────────────────────
  DAV_LDAP_BIND_DN: "cn=svc-dav,ou=services,dc=roadfeldt,dc=com"
  DAV_LDAP_BIND_PASSWORD: "CHANGE_ME"

  # ── Attribute / schema tuning (defaults shown) ────────────────────────────
  DAV_LDAP_USER_ATTR: "uid"        # login attr matched against X-Forwarded-User
  DAV_LDAP_MAIL_ATTR: "mail"
  DAV_LDAP_NAME_ATTR: "cn"
  DAV_LDAP_MEMBER_ATTR: "member"   # group's member attr; use "memberUid" for a posixGroup
  DAV_LDAP_START_TLS: "false"      # true if using ldap:// + StartTLS instead of ldaps://

  # ── Bootstrap + enforcement ───────────────────────────────────────────────
  # Always-admin identities (comma-separated; match oauth username or email).
  # Ensures you can administer even before/without an LDAP role mapping.
  DAV_LDAP_BOOTSTRAP_ADMINS: "chris@roadfeldt.com"
  # Leave "false" until Config -> Users & Access shows the expected approved
  # users, then set "true" to actually reject non-approved accounts.
  DAV_LDAP_ENFORCE: "false"
