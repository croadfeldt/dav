[defaults]
inventory = ansible/inventory/hosts.yaml
roles_path = ansible/roles
vault_password_file = .vault_pass
# YAML-formatted output via the built-in default callback. The old
# `stdout_callback = yaml` (community.general.yaml) was removed in
# community.general 12.0.0; result_format=yaml is the supported replacement.
stdout_callback = ansible.builtin.default
result_format = yaml
callbacks_enabled = profile_tasks
retry_files_enabled = false
host_key_checking = false

[privilege_escalation]
become = false
