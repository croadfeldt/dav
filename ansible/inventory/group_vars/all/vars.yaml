---
# DAV — Framework defaults
#
# This file contains only deployment-target-agnostic defaults. Site-specific
# values (inference endpoint, cluster apps domain, consumer repo URLs, in-cluster
# service DNS) MUST be supplied via vars.local.yaml in this same directory.
#
# Operator setup:
#   1. Copy vars.local.yaml.example -> vars.local.yaml
#   2. Edit vars.local.yaml with site-specific values
#   3. Run ansible-playbook normally; vars.local.yaml is auto-loaded as
#      part of the group_vars/all/ directory.
#
# Secrets are in vault.yaml (ansible-vault encrypted).

# --- Namespace and core resources ---
dav_namespace: dav
dav_service_account: dav-pipeline-sa

# --- Workspace ---
dav_workspace_pvc_size: 20Gi
dav_workspace_pvc_name: dav-workspace
dav_model_cache_pvc_size: 40Gi

# --- Inference Tier 1 (primary) ---
# Endpoint URL is site-specific; supplied via vars.local.yaml.
# These metadata keys describe the primary endpoint configuration for
# operator reference and validate.yaml's diagnostic output. Override
# any of them in vars.local.yaml if the site uses a different model.
inference_primary_model: "qwen"                        # llama.cpp accepts any name
inference_primary_backend: "llamacpp"
inference_primary_model_hf_repo: "bartowski/Qwen3-32B-GGUF"
inference_primary_model_filename: "Qwen3-32B-Q8_0.gguf"
inference_primary_model_format: "GGUF Q8_0"
inference_primary_model_params: "32B"
inference_primary_model_topology: "dual-GPU split-layer"
inference_primary_context_length: 32768

# --- Stage-2 inference tuning (throughput-dependent) ---
# Per-turn LLM output token budget for the dav-run-corpus task.
# This is intentionally a deployment variable, NOT a code constant,
# because the safe value depends on YOUR inference throughput and the
# HAProxy route timeout in front of YOUR endpoint:
#
#   max_tokens / throughput(tok/s)  must stay <  route timeout(s)
#
# On the homelab AMD R9700 stack (~20-26 tok/s, 600s route timeout) the
# honest ceiling is ~10,800 tokens (600s x 18 tok/s worst case). A
# legitimate verbose analysis tops out around ~9,000 tokens (the UC #6
# infrastructure/prod/greenfield case), so 10240 covers real analyses with
# headroom while keeping any single generation under the route timeout.
#
# Set to 10240 — the 504-safe ceiling from the OSAC incident (2026-05-29/30,
# runs 092466/098818): with 16384 on the slow AMD stack, degenerate
# over-generations ran past the 600s route timeout and 504'd. The governing
# constraint is max_tokens / throughput(tok/s) < route_timeout(s); at ~20
# tok/s worst-case 18, 10240 stays under 600s with margin. A 16384 ceiling is
# ONLY safe if the route timeout is raised to ~1200s FIRST (llm-serving commit
# 4cd15a5) — and even then it invites the same degenerate over-generation the
# 504 exposed, so we hold the conservative ceiling here.
# (Does not fix genuinely degenerate over-generation — that needs better stop
# conditions, tracked separately.)
dav_stage2_max_tokens: 10240

# --- Inference Tier 2 (in-cluster vLLM fallback) — OPT-IN ---
# These vars only take effect when the playbook is invoked with
# --tags vllm. By default, the in-cluster vLLM is NOT deployed.
# inference_fallback_endpoint is site-specific and optional; supply
# via vars.local.yaml only if you need failover.
vllm_tier3_model: "casperhansen/deepseek-r1-distill-qwen-14b-awq"
vllm_tier3_max_model_len: 16384
vllm_tier3_image: "vllm/vllm-openai:latest"
vllm_tier3_gpu_node_label: "nvidia.com/gpu.present"
vllm_tier3_gpu_node_value: "true"
vllm_tier3_cpu_request: "2"
vllm_tier3_cpu_limit: "8"
vllm_tier3_memory_request: "8Gi"
vllm_tier3_memory_limit: "24Gi"
vllm_tier3_readiness_delay: 120
vllm_tier3_liveness_delay: 180

# --- Consumer repos ---
# Both URLs are site-specific; supplied via vars.local.yaml.
# Branch defaults below are framework-level conventions that operators
# can override per-deployment.
consumer_spec_repo_branch: "main"
consumer_corpus_repo_branch: "main"

# --- MCP Servers ---
mcp_docs_image: "{{ dav_registry }}/dav-docs-mcp:latest"
mcp_ops_image: "{{ dav_registry }}/dav-ops-mcp:latest"
dav_registry: "image-registry.openshift-image-registry.svc:5000/{{ dav_namespace }}"
# Optional default project id for dav-ops-mcp when a tool call omits project_id.
# dav_ops_mcp_default_project: 20

# --- Webhook Route ---
# dav_webhook_hostname is site-specific; supplied via vars.local.yaml.

# --- Container build ---
dav_build_mcp_images: true

# --- Review Console ---
review_console_enable_oauth: true
review_console_build_images: true
# review_console_hostname is site-specific; supplied via vars.local.yaml.

# Postgres backing store (single-replica, PVC-backed)
review_console_db_name: dav_review
review_console_db_user: dav_review
review_console_db_storage_size: 2Gi
review_console_db_storage_class: ""   # empty = cluster default
review_console_postgres_image: "quay.io/sclorg/postgresql-16-c9s:latest"

# OAuth proxy for OpenShift SSO (injects X-Forwarded-User into API requests)
review_console_oauth_proxy_image: "quay.io/openshift/origin-oauth-proxy:4.14"

# Images (built in-cluster via BuildConfig + ImageStream, pushed to internal registry)
review_console_image_api: "{{ dav_registry }}/dav-review-api:latest"
review_console_image_ui: "{{ dav_registry }}/dav-review-ui:latest"

# Corpus content filters — what the review console indexes from the corpus repo
review_console_corpus_include: "*.md,*.yml,*.yaml,*.json,*.sql,*.py,*.go,*.rst,*.txt,*.toml,*.ini"
review_console_corpus_exclude: ".git,node_modules,.venv,__pycache__,dist,build,*.pyc,*.lock"
