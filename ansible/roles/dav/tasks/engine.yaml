---
# Builds the dav-engine container image and deploys all Tekton Task definitions.

# --- Engine Image Build ---

# Wipe before copy. ansible.builtin.copy is checksum-based and overwrites
# changed files, but it does NOT remove files that exist in the target and
# no longer exist in the source. If a previous playbook run was interrupted
# before its post-build cleanup task fired, /tmp/dav-engine-build can
# contain stale files that get baked into the image. Defensive wipe ensures
# the build context exactly matches the working tree.
- name: Ensure clean engine build context
  ansible.builtin.file:
    path: /tmp/dav-engine-build
    state: absent

- name: Copy engine source to provisioner
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../engine/"
    dest: "/tmp/dav-engine-build/"
    mode: "0644"

# The real provenance path. --build-arg is ALSO passed below, but the deploy
# assertion's first run proved oc has been silently dropping it (build specs
# carry no buildArgs); a context file cannot be dropped.
- name: Bake the deployed commit into the build context
  ansible.builtin.copy:
    content: "{{ dav_repo_commit }}"
    dest: /tmp/dav-engine-build/BUILD_COMMIT
    mode: "0644"

- name: Check if engine BuildConfig exists
  kubernetes.core.k8s_info:
    kind: BuildConfig
    api_version: build.openshift.io/v1
    namespace: "{{ dav_namespace }}"
    name: dav-engine
  register: engine_bc_check

- name: Create engine ImageStream
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: image.openshift.io/v1
      kind: ImageStream
      metadata:
        name: dav-engine
        namespace: "{{ dav_namespace }}"
  when: engine_bc_check.resources | length == 0

- name: Create engine BuildConfig
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: build.openshift.io/v1
      kind: BuildConfig
      metadata:
        name: dav-engine
        namespace: "{{ dav_namespace }}"
      spec:
        source:
          type: Binary
        strategy:
          type: Docker
          dockerStrategy:
            dockerfilePath: Containerfile
        output:
          to:
            kind: ImageStreamTag
            name: "dav-engine:latest"
  when: engine_bc_check.resources | length == 0

- name: Build engine container image
  ansible.builtin.command:
    cmd: >-
      oc start-build dav-engine
      --from-dir=/tmp/dav-engine-build
      --build-arg=DAV_REPO_COMMIT={{ dav_repo_commit }}
      --build-arg=DAV_REPO_DIRTY={{ dav_repo_dirty }}
      -n {{ dav_namespace }}
      --wait
    # Fail in 20 min, not 4h20m: a dead build (BuildPodDeleted, 2026-07-28)
    # left --wait hanging on the corpse for the CronJob-less afternoon.
    timeout: 1200
  register: engine_build_result

- name: Report engine build
  ansible.builtin.debug:
    msg: "Engine build: {{ engine_build_result.stdout | default('completed') }}"

# Merged is not deployed. This asserts the artifact a consumer reads — the
# commit the RUNNING image will stamp into every analysis — against the tree
# this playbook deployed from. A mismatch fails the play loudly instead of
# leaving a stale engine serving behind a green deploy (which happened, and
# cost a voided benchmark).
- name: Assert the built image reports the deployed commit
  ansible.builtin.shell:
    cmd: >-
      oc run dav-verify-commit-{{ 999999 | random }} -n {{ dav_namespace }}
      --rm -i --restart=Never
      --image=image-registry.openshift-image-registry.svc:5000/{{ dav_namespace }}/dav-engine:latest
      --command -- python3 -c
      'from dav.core.version import engine_commit_string; print("COMMIT=" + engine_commit_string())'
  register: engine_commit_probe
  retries: 3
  delay: 10
  until: "'COMMIT=' in engine_commit_probe.stdout"

- name: Fail if the running engine is not the deployed tree
  ansible.builtin.assert:
    that:
      - "('COMMIT=' + dav_repo_commit) in engine_commit_probe.stdout"
    fail_msg: >-
      Deployed image reports {{ engine_commit_probe.stdout | regex_search('COMMIT=[0-9a-f]*') }}
      but this playbook deployed from {{ dav_repo_commit }} — the build did not
      take, or the image did not roll. Do not trust runs until this matches.
    success_msg: "engine image == deployed tree ({{ dav_repo_commit[:12] }})"

- name: Clean up engine build context
  ansible.builtin.file:
    path: /tmp/dav-engine-build
    state: absent

# --- Tekton Task Definitions ---

- name: Create Tekton tasks staging directory
  ansible.builtin.file:
    path: /tmp/dav-tekton-tasks
    state: directory
    mode: "0755"

- name: Render templated Tekton task definitions
  ansible.builtin.template:
    src: "{{ item }}"
    dest: "/tmp/dav-tekton-tasks/{{ item | basename | regex_replace('\\.j2$', '') }}"
    mode: "0644"
  with_fileglob:
    - "{{ role_path }}/templates/tekton-tasks/*.j2"

# Optional extension point: drop plain (non-Jinja) Task YAMLs in
# roles/dav/files/tekton-tasks/ and they get applied alongside the rendered ones.
# git does not track empty directories, so on a fresh clone this path does not
# exist and an unguarded copy fails the whole deploy ("Could not find or access
# 'tekton-tasks/'") — the directory only survives in a working checkout that
# happens to have it. Guard so a clean clone deploys.
- name: Check for non-templated Tekton task definitions
  ansible.builtin.stat:
    path: "{{ role_path }}/files/tekton-tasks"
  register: dav_nontemplated_tekton_tasks

- name: Copy non-templated Tekton task definitions
  ansible.builtin.copy:
    src: "tekton-tasks/"
    dest: "/tmp/dav-tekton-tasks/"
    mode: "0644"
  when: dav_nontemplated_tekton_tasks.stat.exists | default(false)

- name: Apply all Tekton Task definitions
  ansible.builtin.shell:
    cmd: "oc apply -f /tmp/dav-tekton-tasks/ -n {{ dav_namespace }}"
  register: tasks_result

- name: Report Tekton tasks
  ansible.builtin.debug:
    msg: "{{ tasks_result.stdout }}"

- name: Clean up task definitions
  ansible.builtin.file:
    path: /tmp/dav-tekton-tasks
    state: absent
