---
- name: Create GitHub webhook secret
  kubernetes.core.k8s:
    state: present
    server_side_apply:
      field_manager: ansible
      force_conflicts: true
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: github-webhook-secret
        namespace: "{{ dav_namespace }}"
      type: Opaque
      stringData:
        secret: "{{ vault_github_webhook_secret }}"

# --- Review Console secrets ---

- name: Create review console Postgres credentials secret
  kubernetes.core.k8s:
    state: present
    server_side_apply:
      field_manager: ansible
      force_conflicts: true
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: dav-review-db-creds
        namespace: "{{ dav_namespace }}"
        labels:
          app: dav-review
          component: review-console-db
      type: Opaque
      stringData:
        database-name: "{{ review_console_db_name }}"
        database-user: "{{ review_console_db_user }}"
        database-password: "{{ vault_review_console_db_password }}"
        dsn: "postgresql://{{ review_console_db_user }}:{{ vault_review_console_db_password }}@dav-review-db:5432/{{ review_console_db_name }}"

- name: Create review console oauth-proxy session secret
  kubernetes.core.k8s:
    state: present
    server_side_apply:
      field_manager: ansible
      force_conflicts: true
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: dav-review-ui-session
        namespace: "{{ dav_namespace }}"
        labels:
          app: dav-review
          component: review-console-ui
      type: Opaque
      stringData:
        session-secret: "{{ vault_review_console_session_secret }}"
  when: review_console_enable_oauth | bool

# Fernet key for per-repo credential encryption (ADR-004). Used by the
# review-console API to encrypt/decrypt managed_repos.github_pat_encrypted
# and managed_repos.github_webhook_secret_encrypted.
#
# Generate once and add to vars.local.yaml as `vault_dav_fernet_key`:
#   python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
#
# Skipped when the key isn't set so initial deploys don't fail — operator
# can add the key + re-run with --tags secrets later. The API Deployment
# references the Secret with optional: true so a missing Secret doesn't
# block pod start (per-repo credential endpoints return 503 until set).
- name: Create per-repo credential Fernet key Secret
  kubernetes.core.k8s:
    state: present
    server_side_apply:
      field_manager: ansible
      force_conflicts: true
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: dav-fernet-key
        namespace: "{{ dav_namespace }}"
        labels:
          app: dav-review
          component: review-console-api
        annotations:
          dav.dev/purpose: "Fernet key for per-repo credential encryption (ADR-004)"
      type: Opaque
      stringData:
        key: "{{ vault_dav_fernet_key }}"
  when: vault_dav_fernet_key is defined and vault_dav_fernet_key | length > 0
