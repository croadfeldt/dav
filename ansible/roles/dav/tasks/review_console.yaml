---
# Review Console — Postgres-backed team review UI for the DCM corpus.
# Mirrors the build + deploy pattern from mcp_servers.yaml and engine.yaml
# (BuildConfig + ImageStream + binary build, server_side_apply, git-clone
# init container for corpus).

# --- Prerequisite secrets check ---

- name: Verify review console DB password is set in vault
  ansible.builtin.assert:
    that:
      - vault_review_console_db_password is defined
      - vault_review_console_db_password | length >= 16
    fail_msg: >-
      vault_review_console_db_password must be set in
      inventory/group_vars/all/vault.yaml (min 16 chars).
      Run: ansible-playbook playbook.yaml --tags secrets  (after editing vault)

- name: Verify review console session secret is set in vault
  ansible.builtin.assert:
    that:
      - vault_review_console_session_secret is defined
      - vault_review_console_session_secret | length >= 32
    fail_msg: >-
      vault_review_console_session_secret must be set in vault.yaml
      (min 32 chars).
  when: review_console_enable_oauth | bool

# --- API image build (BuildConfig + binary build) ---

- name: Ensure clean review console build context
  ansible.builtin.file:
    path: /tmp/dav-review-build
    state: absent
  when: review_console_build_images | bool

# rsync (not ansible.builtin.copy) so we can EXCLUDE node_modules — the UI's
# lint/e2e harness (ui/lint.sh) runs `npm install`, leaving a 17MB / ~1400-file
# gitignored ui/node_modules tree. copy walks it file-by-file (20+ min) and would
# bloat the image; the build only needs the static index.html + nginx conf. --delete
# keeps the staging dir clean across runs (the _vendor dir is recreated just below).
- name: Stage review console source into the build context (exclude dev cruft)
  ansible.builtin.command:
    cmd: >-
      rsync -a --delete
      --exclude=node_modules/ --exclude=.git/
      --exclude=__pycache__/ --exclude='*.pyc'
      {{ playbook_dir }}/../review-console/ /tmp/dav-review-build/
  register: _rc_rsync
  changed_when: _rc_rsync.rc == 0
  when: review_console_build_images | bool

# Vendor the engine's pure semantic-analysis comparator into the API image at build
# time (single source of truth in engine/; never a hand-maintained fork). The API
# reuses it server-side for static + dynamic prompt A/B. See app/analysis_compare.py.
- name: Ensure the API _vendor dir exists in the build context
  ansible.builtin.file:
    path: /tmp/dav-review-build/api/app/_vendor
    state: directory
    mode: "0755"
  when: review_console_build_images | bool

- name: Vendor the engine analysis comparator into the API build context
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../engine/src/dav/evaluator/compare.py"
    dest: "/tmp/dav-review-build/api/app/_vendor/compare.py"
    mode: preserve
  when: review_console_build_images | bool

- name: Mark the API _vendor dir as a package
  ansible.builtin.copy:
    content: "# Build-time vendored modules (single source in engine/). Do not edit.\n"
    dest: "/tmp/dav-review-build/api/app/_vendor/__init__.py"
    mode: "0644"
  when: review_console_build_images | bool

- name: Check if review console API ImageStream exists
  kubernetes.core.k8s_info:
    kind: ImageStream
    api_version: image.openshift.io/v1
    namespace: "{{ dav_namespace }}"
    name: dav-review-api
  register: review_api_is_check
  when: review_console_build_images | bool

- name: Create review console API ImageStream
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: image.openshift.io/v1
      kind: ImageStream
      metadata:
        name: dav-review-api
        namespace: "{{ dav_namespace }}"
  when:
    - review_console_build_images | bool
    - review_api_is_check.resources | length == 0

- name: Check if review console API BuildConfig exists
  kubernetes.core.k8s_info:
    kind: BuildConfig
    api_version: build.openshift.io/v1
    namespace: "{{ dav_namespace }}"
    name: dav-review-api
  register: review_api_bc_check
  when: review_console_build_images | bool

- name: Create review console API BuildConfig
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: build.openshift.io/v1
      kind: BuildConfig
      metadata:
        name: dav-review-api
        namespace: "{{ dav_namespace }}"
      spec:
        source:
          type: Binary
        strategy:
          type: Docker
          dockerStrategy:
            dockerfilePath: Containerfile
        output:
          to:
            kind: ImageStreamTag
            name: "dav-review-api:latest"
  when:
    - review_console_build_images | bool
    - review_api_bc_check.resources | length == 0

- name: Start binary build for review console API
  ansible.builtin.command:
    cmd: >-
      oc start-build dav-review-api
      --from-dir=/tmp/dav-review-build/api
      --build-arg=DAV_REPO_COMMIT={{ dav_repo_commit }}
      --build-arg=DAV_REPO_DIRTY={{ dav_repo_dirty }}
      -n {{ dav_namespace }}
      --wait
  register: review_api_build
  when: review_console_build_images | bool

- name: Report API build result
  ansible.builtin.debug:
    msg: "Review API build: {{ review_api_build.stdout | default('skipped') }}"
  when: review_console_build_images | bool

# --- UI image build (BuildConfig + binary build) ---

- name: Check if review console UI ImageStream exists
  kubernetes.core.k8s_info:
    kind: ImageStream
    api_version: image.openshift.io/v1
    namespace: "{{ dav_namespace }}"
    name: dav-review-ui
  register: review_ui_is_check
  when: review_console_build_images | bool

- name: Create review console UI ImageStream
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: image.openshift.io/v1
      kind: ImageStream
      metadata:
        name: dav-review-ui
        namespace: "{{ dav_namespace }}"
  when:
    - review_console_build_images | bool
    - review_ui_is_check.resources | length == 0

- name: Check if review console UI BuildConfig exists
  kubernetes.core.k8s_info:
    kind: BuildConfig
    api_version: build.openshift.io/v1
    namespace: "{{ dav_namespace }}"
    name: dav-review-ui
  register: review_ui_bc_check
  when: review_console_build_images | bool

- name: Create review console UI BuildConfig
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: build.openshift.io/v1
      kind: BuildConfig
      metadata:
        name: dav-review-ui
        namespace: "{{ dav_namespace }}"
      spec:
        source:
          type: Binary
        strategy:
          type: Docker
          dockerStrategy:
            dockerfilePath: Containerfile
        output:
          to:
            kind: ImageStreamTag
            name: "dav-review-ui:latest"
  when:
    - review_console_build_images | bool
    - review_ui_bc_check.resources | length == 0

- name: Start binary build for review console UI
  ansible.builtin.command:
    cmd: >-
      oc start-build dav-review-ui
      --from-dir=/tmp/dav-review-build/ui
      --build-arg=DAV_REPO_COMMIT={{ dav_repo_commit }}
      --build-arg=DAV_REPO_DIRTY={{ dav_repo_dirty }}
      -n {{ dav_namespace }}
      --wait
  register: review_ui_build
  when: review_console_build_images | bool

- name: Report UI build result
  ansible.builtin.debug:
    msg: "Review UI build: {{ review_ui_build.stdout | default('skipped') }}"
  when: review_console_build_images | bool

- name: Clean up review console build context
  ansible.builtin.file:
    path: /tmp/dav-review-build
    state: absent
  when: review_console_build_images | bool

# --- Database (Postgres) ---

- name: Deploy review console Postgres PVC
  kubernetes.core.k8s:
    state: present
    server_side_apply:
      field_manager: ansible
      force_conflicts: true
    definition: "{{ lookup('template', 'review-console-db-pvc.yaml.j2') | from_yaml }}"

- name: Deploy review console Postgres Service
  kubernetes.core.k8s:
    state: present
    server_side_apply:
      field_manager: ansible
      force_conflicts: true
    definition: "{{ lookup('template', 'review-console-db-service.yaml.j2') | from_yaml }}"

- name: Check if review console Postgres Deployment exists
  kubernetes.core.k8s_info:
    kind: Deployment
    namespace: "{{ dav_namespace }}"
    name: dav-review-db
  register: review_db_existing

- name: Deploy review console Postgres
  kubernetes.core.k8s:
    state: present
    server_side_apply:
      field_manager: ansible
      force_conflicts: true
    definition: "{{ lookup('template', 'review-console-db-deployment.yaml.j2') | from_yaml }}"

- name: Wait for review console Postgres rollout
  ansible.builtin.command:
    cmd: "oc rollout status deployment/dav-review-db -n {{ dav_namespace }} --timeout=180s"
  register: review_db_rollout
  changed_when: false

# --- API Deployment ---

- name: Deploy DAV-hosted UC repos PVC (pvc-local backend)
  kubernetes.core.k8s:
    state: present
    server_side_apply:
      field_manager: ansible
      force_conflicts: true
    definition: "{{ lookup('template', 'review-console-uc-repos-pvc.yaml.j2') | from_yaml }}"
  when: review_console_uc_repos_enabled | default(true) | bool

- name: Deploy review console API ServiceAccount
  kubernetes.core.k8s:
    state: present
    server_side_apply:
      field_manager: ansible
      force_conflicts: true
    definition: "{{ lookup('template', 'review-console-api-sa.yaml.j2') | from_yaml }}"

- name: Deploy review console sourcing Role + RoleBinding
  kubernetes.core.k8s:
    state: present
    server_side_apply:
      field_manager: ansible
      force_conflicts: true
    definition: "{{ item }}"
  loop: "{{ lookup('template', 'review-console-sourcing-rbac.yaml.j2') | from_yaml_all | list }}"

- name: Deploy review console self-test Role + RoleBinding
  kubernetes.core.k8s:
    state: present
    server_side_apply:
      field_manager: ansible
      force_conflicts: true
    definition: "{{ item }}"
  loop: "{{ lookup('template', 'review-console-self-test-rbac.yaml.j2') | from_yaml_all | list }}"
  when: review_console_runs_trigger_enabled | bool

- name: Deploy review console cluster-monitoring-view ClusterRoleBinding
  kubernetes.core.k8s:
    state: present
    server_side_apply:
      field_manager: ansible
      force_conflicts: true
    definition: "{{ lookup('template', 'review-console-monitoring-rbac.yaml.j2') | from_yaml }}"

- name: Deploy review console service-CA ConfigMap (auto-populated by OCP)
  kubernetes.core.k8s:
    state: present
    server_side_apply:
      field_manager: ansible
      force_conflicts: true
    definition: "{{ lookup('template', 'review-console-service-ca-cm.yaml.j2') | from_yaml }}"

- name: Check if review console API Deployment exists
  kubernetes.core.k8s_info:
    kind: Deployment
    namespace: "{{ dav_namespace }}"
    name: dav-review-api
  register: review_api_existing

- name: Deploy review console API
  kubernetes.core.k8s:
    state: present
    server_side_apply:
      field_manager: ansible
      force_conflicts: true
    definition: "{{ lookup('template', 'review-console-api-deployment.yaml.j2') | from_yaml }}"
  register: review_api_deploy

- name: Deploy review console API Service
  kubernetes.core.k8s:
    state: present
    server_side_apply:
      field_manager: ansible
      force_conflicts: true
    definition: "{{ lookup('template', 'review-console-api-service.yaml.j2') | from_yaml }}"

- name: Restart review console API if updated (not on initial create)
  ansible.builtin.command:
    cmd: "oc rollout restart deployment/dav-review-api -n {{ dav_namespace }}"
  when:
    - review_api_deploy.changed
    - review_api_existing.resources | length > 0

- name: Wait for review console API rollout
  ansible.builtin.command:
    cmd: "oc rollout status deployment/dav-review-api -n {{ dav_namespace }} --timeout=180s"
  register: review_api_rollout
  changed_when: false

# --- UI Deployment ---

- name: Deploy review console UI ServiceAccount
  kubernetes.core.k8s:
    state: present
    server_side_apply:
      field_manager: ansible
      force_conflicts: true
    definition: "{{ lookup('template', 'review-console-ui-sa.yaml.j2') | from_yaml }}"

# --- ConfigMaps use force:true (PUT) instead of server_side_apply because
# SSA merges data keys — renaming or removing a key leaves the old one in
# place. force:true replaces the object wholesale, which is what we want
# for ConfigMaps that hold generated file content.

# HTML content is baked into the dav-review-ui image (Containerfile COPY).
# The HTML ConfigMap and its volume mount were removed; the image is the
# sole source of truth for index.html.

- name: Deploy review console UI nginx ConfigMap
  kubernetes.core.k8s:
    state: present
    force: true
    definition: "{{ lookup('template', 'review-console-ui-nginx-cm.yaml.j2') | from_yaml }}"
  register: review_ui_nginx_cm

- name: Deploy review console UI nginx TLS ConfigMap (external LoadBalancer path)
  kubernetes.core.k8s:
    state: present
    force: true
    definition: "{{ lookup('template', 'review-console-ui-nginx-tls-cm.yaml.j2') | from_yaml }}"
  register: review_ui_nginx_tls_cm
  when: review_console_loadbalancer_enabled | default(false) | bool

- name: Deploy review console UI Service
  kubernetes.core.k8s:
    state: present
    server_side_apply:
      field_manager: ansible
      force_conflicts: true
    definition: "{{ lookup('template', 'review-console-ui-service.yaml.j2') | from_yaml }}"

- name: Assert external LoadBalancer prerequisites
  ansible.builtin.assert:
    that:
      - (review_console_loadbalancer_ip | default('') | length > 0) or (review_console_loadbalancer_pool | default('') | length > 0)
      - review_console_require_auth | default(false) | bool
    fail_msg: >-
      review_console_loadbalancer_enabled requires (a) an explicit
      review_console_loadbalancer_ip OR a review_console_loadbalancer_pool, and
      (b) review_console_require_auth: true — the LoadBalancer path has no
      oauth-proxy in front, so without app-native auth enforcement /api would be
      exposed. Set these in vars.local.yaml.
  when: review_console_loadbalancer_enabled | default(false) | bool

- name: Create review console public TLS Certificate (cert-manager, DNS-01)
  kubernetes.core.k8s:
    state: present
    server_side_apply:
      field_manager: ansible
      force_conflicts: true
    definition: "{{ lookup('template', 'review-console-ui-public-cert.yaml.j2') | from_yaml }}"
  when:
    - review_console_loadbalancer_enabled | default(false) | bool
    - review_console_loadbalancer_create_cert | default(false) | bool

- name: Wait for the public TLS Secret to be issued (first issuance can take minutes)
  kubernetes.core.k8s_info:
    kind: Secret
    namespace: "{{ dav_namespace }}"
    name: "{{ review_console_loadbalancer_tls_secret }}"
  register: review_public_tls_secret
  until: review_public_tls_secret.resources | length > 0
  retries: 60
  delay: 10
  when:
    - review_console_loadbalancer_enabled | default(false) | bool
    - review_console_loadbalancer_create_cert | default(false) | bool

- name: Check if review console UI Deployment exists
  kubernetes.core.k8s_info:
    kind: Deployment
    namespace: "{{ dav_namespace }}"
    name: dav-review-ui
  register: review_ui_existing

- name: Deploy review console UI
  kubernetes.core.k8s:
    state: present
    server_side_apply:
      field_manager: ansible
      force_conflicts: true
    definition: "{{ lookup('template', 'review-console-ui-deployment.yaml.j2') | from_yaml }}"
  register: review_ui_deploy

- name: Restart review console UI if ConfigMaps or Deployment changed
  ansible.builtin.command:
    cmd: "oc rollout restart deployment/dav-review-ui -n {{ dav_namespace }}"
  when:
    - review_ui_existing.resources | length > 0
    # (review_ui_html_cm removed — the HTML ConfigMap is gone; index.html is
    #  baked into the image. Its dangling .changed reference here would crash
    #  any run where the deployment already exists.)
    - (review_ui_deploy.changed or review_ui_nginx_cm.changed or (review_ui_nginx_tls_cm.changed | default(false)))

- name: Wait for review console UI rollout
  ansible.builtin.command:
    cmd: "oc rollout status deployment/dav-review-ui -n {{ dav_namespace }} --timeout=180s"
  register: review_ui_rollout
  changed_when: false

# --- TLS via cert-manager (Let's Encrypt) ---

- name: Assert cert-manager Let's Encrypt settings when issuer creation is requested
  ansible.builtin.assert:
    that:
      - review_console_letsencrypt_email | default('') | length > 0
      - review_console_cert_manager_issuer_name | default('') | length > 0
    fail_msg: >-
      review_console_cert_manager_create_issuer is true but
      review_console_letsencrypt_email / review_console_cert_manager_issuer_name
      are not set. Add them to vars.local.yaml.
  when:
    - review_console_cert_manager_enabled | default(false) | bool
    - review_console_cert_manager_create_issuer | default(false) | bool

# Safety: never overwrite an existing issuer of this name. The cluster may
# already have a (DNS-01) ClusterIssuer named e.g. letsencrypt-prod shared with
# other apps; recreating it from this HTTP-01 template would break them. So
# "create_issuer" means create-only-if-absent.
- name: Check for an existing cert-manager issuer of this name
  kubernetes.core.k8s_info:
    api_version: cert-manager.io/v1
    kind: "{{ review_console_cert_manager_issuer_kind }}"
    name: "{{ review_console_cert_manager_issuer_name }}"
    namespace: "{{ dav_namespace if review_console_cert_manager_issuer_kind == 'Issuer' else omit }}"
  register: review_existing_issuer
  when:
    - review_console_cert_manager_enabled | default(false) | bool
    - review_console_cert_manager_create_issuer | default(false) | bool

- name: Create review console Let's Encrypt issuer (only if absent)
  kubernetes.core.k8s:
    state: present
    server_side_apply:
      field_manager: ansible
      force_conflicts: true
    definition: "{{ lookup('template', 'review-console-cert-issuer.yaml.j2') | from_yaml }}"
  when:
    - review_console_cert_manager_enabled | default(false) | bool
    - review_console_cert_manager_create_issuer | default(false) | bool
    - (review_existing_issuer.resources | default([]) | length) == 0

- name: Note when an existing issuer was reused instead of created
  ansible.builtin.debug:
    msg: >-
      cert-manager {{ review_console_cert_manager_issuer_kind }}
      '{{ review_console_cert_manager_issuer_name }}' already exists — reusing it,
      not overwriting (create_issuer was requested but the issuer is present).
  when:
    - review_console_cert_manager_enabled | default(false) | bool
    - review_console_cert_manager_create_issuer | default(false) | bool
    - (review_existing_issuer.resources | default([]) | length) > 0

- name: Deploy review console Route
  kubernetes.core.k8s:
    state: present
    server_side_apply:
      field_manager: ansible
      force_conflicts: true
    definition: "{{ lookup('template', 'review-console-ui-route.yaml.j2') | from_yaml }}"

- name: Report review console URL
  ansible.builtin.debug:
    msg: "Review Console → https://{{ review_console_hostname }}"

# --- External MetalLB LoadBalancer (custom port) ---

- name: Deploy review console external LoadBalancer Service
  kubernetes.core.k8s:
    state: present
    server_side_apply:
      field_manager: ansible
      force_conflicts: true
    definition: "{{ lookup('template', 'review-console-ui-lb-service.yaml.j2') | from_yaml }}"
  when: review_console_loadbalancer_enabled | default(false) | bool

- name: Remove review console external LoadBalancer Service when disabled
  ansible.builtin.command:
    cmd: "oc -n {{ dav_namespace }} delete service/dav-review-ui-lb --ignore-not-found"
  when: not (review_console_loadbalancer_enabled | default(false) | bool)
  changed_when: false

- name: Deploy review console cert-renewal CronJob
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'review-console-cert-renewal-cronjob.yaml.j2') | from_yaml_all | list }}"
  when:
    - review_console_loadbalancer_enabled | default(false) | bool
    - review_console_loadbalancer_cert_renewal_restart | default(true) | bool

- name: Remove review console cert-renewal CronJob when disabled
  ansible.builtin.command:
    cmd: "oc -n {{ dav_namespace }} delete cronjob/dav-review-cert-renewal --ignore-not-found"
  when: not (review_console_loadbalancer_enabled | default(false) | bool and review_console_loadbalancer_cert_renewal_restart | default(true) | bool)
  changed_when: false

- name: Report review console external URL
  ansible.builtin.debug:
    msg: "External (MetalLB) → https://{{ review_console_hostname }}:{{ review_console_loadbalancer_port }} on {{ review_console_loadbalancer_ip | default(review_console_loadbalancer_pool) }}"
  when: review_console_loadbalancer_enabled | default(false) | bool

- name: Deploy self-improvement scan CronJob (Phase 3)
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'self-improve-scan-cronjob.yaml.j2') | from_yaml_all | list }}"
  when: dav_self_improve_scan_enabled | bool

- name: Remove self-improvement scan CronJob when disabled
  ansible.builtin.command:
    cmd: "oc -n {{ dav_namespace }} delete cronjob/dav-self-improve-scan --ignore-not-found"
  when: not (dav_self_improve_scan_enabled | bool)
  changed_when: false
