uuid: uc-tinyurl-001
handle: authentication/login-flow
scenario:
  description: A registered user submits valid credentials (email + password) to
    POST /api/auth/login. The system looks up the user by email, checks suspension
    status, verifies the password hash using bcrypt, updates last_login_at on success,
    and issues a signed session cookie with 7-day validity. Invalid credentials return
    401 without revealing which field was wrong (enumeration prevention). Suspended
    accounts return 403 without checking the password. Login attempts are rate-limited
    at 5 per email per 15 minutes.
  actor:
    persona: registered-user
    profile: standard
  intent: Authenticate via credentials and receive a valid session
  success_criteria:
    - A valid login produces a session cookie for 7-day authenticated access
    - Invalid credentials do not leak whether email or password was incorrect
    - Suspended accounts cannot log in regardless of password correctness
    - Login attempts are rate-limited at 5 per email per 15 minutes
  dimensions:
    lifecycle_phase: new_request
    resource_complexity: single_no_deps
    policy_complexity: single_validation
    provider_landscape: single_eligible
    governance_context: standard_governance
    failure_mode: happy_path
  profile: standard
  expected_domain_interactions:
    - domain: data
      interaction: user lookup by email, password hash verification, last_login_at update
    - domain: policy
      interaction: rate limiting and suspension checks gate the login flow
    - domain: audit
      interaction: login attempt recorded with outcome
