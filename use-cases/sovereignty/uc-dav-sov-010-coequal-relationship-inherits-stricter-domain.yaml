handle: dav-self/sovereignty/coequal-relationship-inherits-stricter-domain
scenario:
  description: The generalized modeling primitive behind uc-sov-004/008/009 — a relationship (edge) between
    two co-equal entities is owned by, and inherits the isolation/residency of, the more-restrictive domain.
    When the fact of the association is itself sensitive, the edge must live in the stricter domain and
    never be replicated to a shared plane. Customer↔tenant is the canonical instance; the same rule must
    apply uniformly to any cross-domain association (provider↔consumer, asset↔jurisdiction, account↔engagement)
    rather than being special-cased. This is the rule UDLM encodes in the data-model contract and DCM
    enforces architecturally.
  actor:
    persona: platform-engineer
    profile: sovereign
  intent: Apply one uniform rule — relationship edges resolve into and inherit the isolation of the stricter
    co-equal domain — across all entity pairs
  success_criteria:
  - An edge between co-equal entities is stored in the more-restrictive domain, not a shared plane
  - The edge inherits the stricter domain's residency, isolation, and provenance
  - No shared surface materializes an edge whose fact-of-association is marked sensitive
  - The rule is applied uniformly across entity pairs, not special-cased to customer↔tenant
  dimensions:
    lifecycle_phase: new_request
    resource_complexity: cross_dependency_payload
    policy_complexity: single_validation
    provider_landscape: single_eligible
    governance_context: sovereignty_enforced
    failure_mode: happy_path
  profile: sovereign
  expected_domain_interactions:
  - domain: data
    interaction: the relationship edge is persisted in the stricter domain and tagged with its provenance/residency
  - domain: policy
    interaction: a domain-resolution gatekeeper places each co-equal edge in the more-restrictive domain
  - domain: audit
    interaction: the edge-placement decision (which domain owns it, and why) is recorded
