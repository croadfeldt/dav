handle: dav-self/sovereignty/tenant-scoped-customer-identity
scenario:
  description: Customer and tenant are CO-EQUAL entities with an M:N relationship — not a hierarchy. A
    customer identity MAY be shared (one stable anchor referenceable from any tenant), but the customer↔tenant
    RELATIONSHIP and all customer-attributed data are tenant-owned. No shared surface may expose which
    tenants a customer spans, because the mere existence of the relationship is itself confidential (bank-secrecy
    / client- confidentiality) and a shared customer-to-tenant directory would leak who-works-with-whom
    between competing regulated institutions. The mapping IS the edge, and the edge obeys tenancy. (Refines
    the v1 "no shared identity / two unlinked records" stance — a bare, non-relationship-revealing identity
    anchor may be shared; everything relationship- or data-bearing stays in the tenant.)
  actor:
    persona: data-steward
    profile: sovereign
  intent: Keep the customer↔tenant relationship and customer-attributed data tenant-owned, sharing only
    a bare, non-relationship-revealing customer identity anchor
  success_criteria:
  - The customer↔tenant relationship edge and customer-attributed data resolve only within the owning
    tenant
  - No API surfaces which tenants a given customer is associated with (no shared customer-to-tenant directory)
  - The shared customer identity anchor carries no tenant-mapping or relationship-revealing metadata
  - Enumerating the tenants a customer spans requires a deliberate, audited cross-tenant operation
  dimensions:
    lifecycle_phase: new_request
    resource_complexity: single_no_deps
    policy_complexity: single_gatekeeper
    provider_landscape: single_eligible
    governance_context: compliance_gated
    failure_mode: happy_path
  profile: sovereign
  expected_domain_interactions:
  - domain: data
    interaction: bare customer identity anchor created in the control plane with no tenant-mapping; the
      relationship edge and customer data are created within the tenant boundary only
  - domain: policy
    interaction: confidentiality policy forbids exposing any customer↔tenant mapping on a shared surface
  - domain: audit
    interaction: relationship-edge creation recorded in-tenant; any cross-tenant enumeration recorded
      as a privileged operation
