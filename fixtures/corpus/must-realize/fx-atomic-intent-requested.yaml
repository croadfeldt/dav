scenario:
  description: 'A consumer needs all-or-nothing semantics: four resources that are only useful together,
    where a three-of-four outcome is worse than nothing. Success is REALIZATION of a consumer-declared
    atomic intent — or, if any member would be refused, refusal of the whole. The platform''s default
    is best-effort partial fulfilment, which is the right default; the question is whether a consumer
    whose requirement is transactional can express that at all.'
