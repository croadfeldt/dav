scenario:
  description: 'A tenant''s resource orders-api was realized against the credential reference
    credref://tenant-a/db-primary, resolved at realization time per 30-credentials.md. After a
    suspected exposure, the credential''s owner issues rotate: the material behind the reference
    is atomically replaced and the reference identifier stays stable (65-rotation.md). Success is
    the rotation taking full effect: not just new material behind the reference, but the consumers
    realized BEFORE the rotation — which hold the material current at their realization — being
    refreshed to the new material or notified to re-resolve, within a bounded window. A rotation
    that only future realizations observe does not revoke anything.'
  actor:
    persona: application-team-member
    profile: standard
  intent: Rotate a credential reference and have the rotation take effect for consumers realized
    before it, not only for future realizations
  success_criteria:
  - rotate atomically replaces the secret material and the reference identifier is unchanged
    across the rotation
  - Consumers realized before the rotation are refreshed to the new material, or notified to
    re-resolve the reference
  - The window in which pre-rotation material remains in use is bounded and stated, so the owner
    can know when the old secret is fully out of service
