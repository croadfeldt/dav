scenario:
  description: 'An intent for a cache resource, analytics-cache, is eligible for two providers,
    prov-a-01 and prov-b-02; the profile''s preference order selects prov-a-01. Selection is a
    total, deterministic function of the declared sets (40-providers.md), so for any given intent,
    inventory and profile there IS a definite answer to "why this provider". Success is REALIZATION
    plus the operator being able to give that answer afterwards: the platform must record, at
    selection time, which providers were eligible and which rule decided among them, retrievable
    after the fact — not reconstructed by replaying the selection function against an inventory
    that may since have drifted.'
  actor:
    persona: platform-operator
    profile: standard
  intent: Realize a resource with multiple eligible providers and be able to explain, after the
    fact, why the selected provider was chosen
  success_criteria:
  - The intent is realized on the provider the deterministic selection order chooses
  - The selection outcome is recorded at selection time, naming the eligible providers and the
    rule that decided among them
  - The record is retrievable after realization, so the choice can be explained without replaying
    selection against the historical inventory and profile
  dimensions:
    lifecycle_phase: new_request
    resource_complexity: single_no_deps
    policy_complexity: single_validation
    provider_landscape: multiple_eligible
    governance_context: standard_governance
    failure_mode: happy_path
  profile: standard
  perspectives:
  - platform-operator
