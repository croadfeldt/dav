scenario:
  description: 'An intent declares four resources; one violates policy. Halyard realizes the three
    valid members and refuses the fourth — which is the CORRECT outcome, since the violation is
    scoped to that member and blocking the rest would deny work that breaks no rule. What the consumer
    then needs is to be told: the partial outcome must be surfaced as a warning that says which
    member was refused, WHY, and where possible how to resolve it. This is an intent-requirement
    concern, not an operational failure — the platform did what was asked; the consumer''s declared
    intent was not fully satisfiable and they have to be able to see that and act on it.'
  actor:
    persona: application-team-member
    profile: standard
  intent: Submit a multi-resource intent in which one member violates policy, and be told clearly
    that the outcome was partial, why, and how to resolve it
  success_criteria:
