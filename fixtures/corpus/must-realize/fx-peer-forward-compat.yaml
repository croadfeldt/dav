scenario:
  description: 'Two federated Halyard instances exchanged protocol version strings at registration:
    halyard-b runs protocol 1.4, halyard-a runs 1.2. A caller on halyard-b submits an intent that
    halyard-b dispatches to halyard-a, carrying the originating caller''s identity per
    70-federation.md — and also carrying a field added in protocol 1.3, placement_hints, that
    halyard-a''s version predates. Success is REALIZATION on the older instance: unknown fields
    the receiver does not consume are ignored rather than treated as errors (must-ignore-unknown),
    and the versions exchanged at registration back a stated compatibility rule the integrator can
    check — so a mixed-version federation can be upgraded one instance at a time without the newer
    peer breaking the older one.'
  actor:
    persona: application-team-member
    profile: standard
  intent: Dispatch an intent from a newer-protocol instance to an older peer and have it realized,
    with unknown fields ignored rather than fatal
  success_criteria:
  - The dispatched intent is realized on the receiving, older-protocol instance
  - Fields introduced by a newer protocol version and unknown to the receiver are ignored, not
    treated as errors or grounds for refusal
  - The protocol versions exchanged at registration back a stated compatibility rule, so an
    integrator can determine before dispatch whether a peer pair is compatible
