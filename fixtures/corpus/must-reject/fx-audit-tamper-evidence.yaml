version: 1.0.0
scenario:
  description: A compliance auditor is asked to attest that a tenant's audit trail is complete
    and unaltered over the retention window. The platform asserts records are append-only and
    sequence-numbered per tenant. The guarantee under test is the refusal-adjacent one that
    makes "append-only" more than a promise — tamper-evidence. Without an integrity proof, a
    record rewritten in place under its original sequence number, or a truncated tail, is
    indistinguishable from an honest trail, and the auditor is attesting to the platform's
    word, not to evidence.
  actor:
    persona: compliance-auditor
    profile: standard
  intent: Verify, from the audit records themselves, that no record in the tenant's trail has
    been modified or removed since it was appended
  success_criteria:
  - Every audit record is covered by a tamper-evidence mechanism the auditor can check (80-audit.md)
  - In-place modification of an existing record is detectable, even when its sequence number
    is preserved
  - Removal of records — including truncation of the tail — is detectable beyond gaps in the
    per-tenant monotonic sequence
  - Integrity is verifiable across the tenant's configured retention window
  dimensions:
    lifecycle_phase: new_request
    resource_complexity: single_no_deps
    policy_complexity: single_validation
    provider_landscape: single_eligible
    governance_context: standard_governance
    failure_mode: policy_violation
  profile: standard
  perspectives:
  - compliance-auditor
