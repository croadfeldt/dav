scenario:
  description: 'An intent declares resource A and resource B, where B has a hard dependency on A.
    A violates policy and is refused. Success is the REFUSAL OF B TOO. Realizing B with its dependency
    unmet produces a broken graph — a resource pointing at something that does not exist. Unlike
    partial fulfilment of INDEPENDENT members, which is correct behaviour, a broken dependency is
    a failure: the platform has created state the consumer''s intent never described and which cannot
    function.'
