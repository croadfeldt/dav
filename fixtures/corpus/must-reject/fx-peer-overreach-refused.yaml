version: 1.0.0
scenario:
  description: An instance is federated with a peer in another jurisdiction. A caller submits
    an intent whose fulfilment would be dispatched to that peer, carrying resource content the
    originating side must not export. Success is the REFUSAL, and the refusal must happen on the
    ORIGINATING side — a dispatch boundary evaluated before the intent body leaves the instance.
    The peer's own tenancy evaluation is not a substitute; by the time the peer refuses, the
    content has already crossed.
  actor:
    persona: application-team-member
    profile: standard
  intent: Submit an intent that would be dispatched to a federated peer beyond what the
    originating instance's sovereignty and tenancy boundary permits, and have the dispatch
    refused before anything crosses
  success_criteria:
  - The overreaching dispatch is refused at the originating instance; no part of the intent
    body reaches the peer
  - The refusal carries a machine-matchable reason_code per the refusal contract (10-refusal-contract.md §1)
  - The refusal remediation names the scoping mechanism that would make the dispatch legal (10-refusal-contract.md §2)
  - A legal dispatch still carries the originating caller identity (70-federation.md On-behalf-of)
  dimensions:
    lifecycle_phase: new_request
    resource_complexity: single_no_deps
    policy_complexity: cross_domain_constraint
    provider_landscape: multiple_eligible
    governance_context: standard_governance
    failure_mode: policy_violation
  profile: standard
  perspectives:
  - federation-peer-operator
  - sovereignty-authority
